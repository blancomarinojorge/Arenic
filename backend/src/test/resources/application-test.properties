# 1. Disable Flyway so it doesn't try to run your Postgres SQL scripts
spring.flyway.enabled=false

# 2. Tell Hibernate to create the schema from your Java Entities
spring.jpa.hibernate.ddl-auto=create-drop

# 3. Use the H2 Dialect (ensures Hibernate writes H2-friendly SQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 4. Optional: Show SQL in console for debugging
spring.jpa.show-sql=true