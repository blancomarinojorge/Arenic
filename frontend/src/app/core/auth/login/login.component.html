<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 w-full max-w-md p-8">

    <div class="mb-8">
      <h1 class="text-2xl font-semibold text-slate-800">Welcome back</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in to manage your reservations</p>
    </div>

    @if (errorMessage()) {
      <div class="mb-6 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">
          Email
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
          class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-transparent transition-shadow"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="text-xs text-red-600 mt-1 block">Enter a valid email address</span>
        }
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">
          Password
        </label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-transparent transition-shadow"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="text-xs text-red-600 mt-1 block">Password is required</span>
        }
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full mt-2 py-2.5 px-4 bg-slate-800 hover:bg-slate-700 disabled:bg-slate-400 disabled:cursor-not-allowed text-white text-sm font-medium rounded-lg transition-colors"
      >
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>

    </form>

  </div>
</div>
