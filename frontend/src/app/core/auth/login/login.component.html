<div class="grid grid-cols-12 h-screen">
  <div class="hidden lg:flex lg:col-span-7 min-h-0">
    <img src="/images/loginSidebar.png" class="object-cover h-full w-full">
  </div>
  <div class="col-span-12 lg:col-span-5  h-full flex flex-col content-center items-center">
    <section class="flex flex-col grow gap-l justify-center">
      <div class="flex flex-col gap-s items-center ">
        <img src="images/logo.png" class="w-12">
        <h2 class="ds-text-style-heading-m-bold italic text-content-primary">Bienvenido a Arenic</h2>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div>
          <div class="flex flex-col gap-xs">
            <label for="email" class="text-content-primary ds-text-style-text-m-regular">
              email
            </label>
            <app-text-input-component
              placeholder="email..."
              id="email"
              type="email"
              icon="email"
              formControlName="email"
            />
            @if (email.invalid && email.dirty) {
              <span class="text-content-negative ds-text-style-text-s-regular">error email</span>
            }
            <input type="text" class="border border-border-focus rounded-2xs">
          </div>
        </div>
        <button type="submit">Log in</button>
      </form>
    </section>
  </div>
</div>
