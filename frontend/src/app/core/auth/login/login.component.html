<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 w-full max-w-md p-8">

    <div class="mb-8">
      <h1 class="text-2xl font-semibold text-slate-800">Welcome back</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in to manage your reservations</p>
    </div>

    @if (errorMessage()) {
      <div class="mb-6 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">
          Email
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
          class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-transparent transition-shadow"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="text-xs text-red-600 mt-1 block">Enter a valid email address</span>
        }
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">
          Password
        </label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-transparent transition-shadow"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="text-xs text-red-600 mt-1 block">Password is required</span>
        }
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full mt-2 py-2.5 px-4 bg-slate-800 hover:bg-slate-700 disabled:bg-slate-400 disabled:cursor-not-allowed text-white text-sm font-medium rounded-lg transition-colors"
      >
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>

      <div class="flex items-center gap-3 my-2">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span class="text-xs text-slate-400">or</span>
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <button
        type="button"
        (click)="onGoogleButtonClick()"
        [disabled]="loading()"
        class="w-full py-2.5 px-4 bg-white hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed border border-slate-300 text-slate-700 text-sm font-medium rounded-lg transition-colors flex items-center justify-center gap-2"
      >
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

    </form>

  </div>
</div>
